[package]
name = "eleven-rack-editor-tauri"
version = "0.1.2-beta12"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Tauri/Rust development port of the Eleven Rack Editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
