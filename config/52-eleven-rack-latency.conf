# Defaults measured on Ubuntu with PipeWire 1.6.2; reused on other distros.
# Arch/RPM physical latency is not yet validated. Six small high-rate profiles
# are estimates; the other eighteen profiles are based on measurements.
# Queue/USB delay is measured dynamically; 140 frames is the measured residual
# roundtrip correction after reported latency, attributed to capture. It is not
# an independently measured converter delay or a total USB+analog measurement.
monitor.alsa.rules = [ {
  matches = [
    { node.name = "~alsa_input.usb-Digidesign_Eleven_Rack.*" api.alsa.card.id = "~Rack(_[0-9]+)?" }
    { node.name = "~alsa_output.usb-Digidesign_Eleven_Rack.*" api.alsa.card.id = "~Rack(_[0-9]+)?" }
  ]
  actions = { update-props = {
    api.alsa.eleven-latency = true
    api.alsa.eleven-analog-delay = 140
    api.alsa.eleven-correction-96000-256 = -37
    api.alsa.eleven-correction-96000-128 = -32
    api.alsa.eleven-correction-96000-64 = -32
    api.alsa.eleven-correction-88200-256 = -28
    api.alsa.eleven-correction-88200-128 = -46
    api.alsa.eleven-correction-88200-64 = -46
    api.alsa.eleven-correction-44100-64 = 3
    api.alsa.eleven-correction-44100-128 = 14
    api.alsa.eleven-correction-44100-256 = 17
    api.alsa.eleven-correction-44100-512 = 6
    api.alsa.eleven-correction-44100-1024 = 5
    api.alsa.eleven-correction-44100-2048 = 7
    api.alsa.eleven-correction-48000-64 = 14
    api.alsa.eleven-correction-48000-128 = 12
    api.alsa.eleven-correction-48000-256 = 13
    api.alsa.eleven-correction-48000-512 = 13
    api.alsa.eleven-correction-48000-1024 = 10
    api.alsa.eleven-correction-48000-2048 = 18
    api.alsa.eleven-correction-88200-512 = -46
    api.alsa.eleven-correction-88200-1024 = -37
    api.alsa.eleven-correction-88200-2048 = -34
    api.alsa.eleven-correction-96000-512 = -36
    api.alsa.eleven-correction-96000-1024 = -37
    api.alsa.eleven-correction-96000-2048 = -28
# Signed additions to the existing runtime report; unknown profiles have no override.
  } }
} ]
