name: Arch package set

on:
  workflow_dispatch:
    inputs:
      kernel_package_version:
        description: 'Arch linux/linux-headers package version, e.g. 7.2.9.arch1-1; empty uses current stable'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'packaging/arch/**'
      - 'tools/*arch*'
      - 'tools/build-latency*'
      - 'tools/spa-eleven-alsa.c'
      - 'packaging/pipewire*'
      - 'packaging/prepare-driver.py'
      - 'packaging/mixer-eleven-rack.h'
      - 'packaging/build-driver-common.sh'
      - 'editor/**'
      - 'config/**'
      - 'VERSION'
      - '.github/workflows/arch-packages.yml'
permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed ca-certificates git python linux linux-headers dkms \
            alsa-lib pipewire pipewire-audio pipewire-jack wireplumber \
            bc cpio libelf openssl pahole rust rust-src rust-bindgen npm nodejs curl kmod
          useradd --create-home builder
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select an older kernel when requested
        env:
          KERNEL_PACKAGE_VERSION: ${{ inputs.kernel_package_version }}
        run: |
          if [ -n "$KERNEL_PACKAGE_VERSION" ]; then
            python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9][A-Za-z0-9_.+-]*', os.environ['KERNEL_PACKAGE_VERSION']):
              raise SystemExit('Invalid Arch kernel package version')
          PY
            mkdir -p build/kernel-inputs
            cd build/kernel-inputs
            for package in linux linux-headers; do
              filename="${package}-${KERNEL_PACKAGE_VERSION}-x86_64.pkg.tar.zst"
              url="https://archive.archlinux.org/packages/l/${package}/${filename}"
              curl --fail --location --retry 3 --output "$filename" "$url"
              curl --fail --location --retry 3 --output "$filename.sig" "$url.sig"
              pacman-key --verify "$filename.sig"
            done
            pacman -U --noconfirm ./*.pkg.tar.zst
          fi
      - name: Validate packaging and editor
        run: |
          python3 -m compileall -q tools packaging editor/bridge-linux
          python3 tools/test-latency-packaging.py
          python3 tools/test-arch-packaging.py
          python3 -m unittest discover -s editor/bridge-linux/tests
          node --test editor/tests/*.test.cjs
          bash -n tools/build-arch-package-set.sh packaging/arch/build-driver.sh
      - name: Build complete driver and editor packages
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash tools/build-arch-package-set.sh
      - name: Check package metadata and checksums
        run: |
          for package in build/arch-set/*.pkg.tar.zst; do pacman -Qip "$package"; done
          cd build/arch-set
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package-set
          path: build/arch-set/*
          if-no-files-found: error
          retention-days: 30
