name: Tauri editor preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'editor-tauri/**'
      - 'editor/src/**'
      - 'editor/assets/**'
      - '.github/workflows/tauri-editor.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native build and headless GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf xvfb xauth dbus-x11
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          rustup default 1.93.1
      - name: Install CLI
        run: npm ci --prefix editor-tauri
      - name: Check frontend compatibility and Rust formatting
        run: |
          npm --prefix editor-tauri test
          cargo fmt --manifest-path editor-tauri/src-tauri/Cargo.toml -- --check
      - name: Test Rust services
        run: cargo test --locked --manifest-path editor-tauri/src-tauri/Cargo.toml -j 2
      - name: Build preview package
        run: npm --prefix editor-tauri run build -- --debug --bundles deb
      - name: Check WebKit startup and panel layout without MIDI hardware
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 editor-tauri/src-tauri/target/debug/eleven-rack-editor-tauri --smoke-test --logs
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-editor-preview-deb
          path: editor-tauri/src-tauri/target/debug/bundle/deb/*.deb
          retention-days: 14
