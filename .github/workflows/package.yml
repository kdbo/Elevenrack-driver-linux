name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends desktop-file-utils
      - name: Determine package version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          version = Path('VERSION').read_text().strip()
          if os.environ['REF_TYPE'] == 'tag':
              match = re.fullmatch(r'v(\d+\.\d+\.\d+)(?:[-_](alpha|beta|rc)(\d+))?', os.environ['REF_NAME'])
              if not match:
                  raise SystemExit('Use vX.Y.Z or vX.Y.Z-betaN/alphaN/rcN (underscore also accepted)')
              base, stage, number = match.groups()
              tagged = base + (f'~{stage}{number}' if stage else '')
              if tagged != version:
                  raise SystemExit(f'Tag version {tagged} does not match VERSION ({version})')
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:~(?:alpha|beta|rc)\d+)?', version):
              raise SystemExit('Invalid VERSION')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={str("~" in version).lower()}', file=output)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print(f'PACKAGE_VERSION={version}', file=output)
          PY
      - name: Validate scripts and metadata
        run: |
          python3 -m compileall -q tools packaging
          python3 tools/test-kernel-source.py
          for script in tools/*.sh packaging/*.sh; do bash -n "$script"; done
          for script in packaging/postinst packaging/prerm packaging/postrm; do sh -n "$script"; done
          python3 -m json.tool packaging/ubuntu-kernels.json >/dev/null
          python3 -m json.tool docs/compatibility-builds.json >/dev/null
          python3 -m json.tool docs/hwe-build.json >/dev/null
          desktop-file-validate config/eleven-rack-driver.desktop
      - name: Build and check Debian package
        run: |
          python3 tools/build-deb.py --version "$PACKAGE_VERSION"
          python3 tools/check-package.py "build/packages/eleven-rack-driver_${PACKAGE_VERSION}_all.deb" --version "$PACKAGE_VERSION"
          cd build/packages
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  hwe:
    name: Ubuntu 24.04 HWE driver build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching HWE headers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends build-essential dpkg-dev ca-certificates bzip2 xz-utils kmod \
            linux-headers-7.0.0-38-generic=7.0.0-38.38~24.04.4
      - name: Build using automatic exact HWE sources
        run: |
          mkdir -p build/hwe
          cp packaging/prepare-driver.py packaging/fetch-kernel-source.py build/hwe/
          cd build/hwe
          set -o pipefail
          ELEVEN_SOURCE_CACHE="$PWD/source-cache" bash ../../packaging/build-driver.sh \
            7.0.0-38-generic /usr/src/linux-headers-7.0.0-38-generic 2>&1 | tee build.log
          modinfo -F vermagic kernel-source/sound/usb/snd-usb-audio.ko | grep -q '^7.0.0-38-generic '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-24.04-hwe-build-log
          path: build/hwe/build.log
          if-no-files-found: warn
          retention-days: 30

  editor:
    name: Build editor Debian package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor build dependencies
        working-directory: editor
        run: npm ci
      - name: Check Linux bridge and renderer
        run: |
          python3 -m unittest discover -s editor/bridge-linux/tests
          node --test editor/tests/*.test.cjs
          python3 -m compileall -q editor/bridge-linux
          node --check editor/main.js
          node --check editor/preload.js
          for script in editor/src/js/*.js; do node --check "$script"; done
      - name: Build editor with release version
        working-directory: editor
        run: |
          EDITOR_VERSION="${PACKAGE_VERSION/~/-}"
          npm run build:linux -- --x64 --config.extraMetadata.version="$EDITOR_VERSION"
      - name: Validate editor package
        run: |
          packages=(editor/dist/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Package)" = eleven-rack-editor-linux
          test "$(dpkg-deb -f "$package" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          mkdir -p build/editor-package-check
          dpkg-deb -x "$package" build/editor-package-check
          resources="build/editor-package-check/opt/Eleven Rack Editor/resources"
          test -s "$resources/app.asar"
          test -s "$resources/bridge-linux/bridge.py"
          test -s "$resources/eleven-rack-editor-logo.png"
          test -s build/editor-package-check/usr/share/applications/eleven-rack-editor-linux.desktop
          cd editor/dist
          sha256sum *.deb > EDITOR-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: editor-debian-package
          path: |
            editor/dist/*.deb
            editor/dist/EDITOR-SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, hwe, editor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: editor-debian-package
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check EDITOR-SHA256SUMS
          sha256sum *.deb > SHA256SUMS
          flags=(--verify-tag --generate-notes --title "Eleven Rack Linux $RELEASE_TAG")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" *.deb SHA256SUMS "${flags[@]}"
