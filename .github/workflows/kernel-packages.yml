name: Kernel package availability
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/check-kernel-packages.py'
      - 'packaging/ubuntu-kernels.json'
      - '.github/workflows/kernel-packages.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check interim Ubuntu kernel build inputs
        run: python3 tools/check-kernel-packages.py --releases 24.10 25.04 25.10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-package-availability
          path: build/kernel-package-availability.json
          if-no-files-found: warn
          retention-days: 30
